 el('app').innerHTML=`<header class="topline"><div class="brand"><span class="mascot">🐰</span><div><h1>Fable Fusions</h1><p>CREATURE TEST v0.2</p></div></div><div style="display:flex;gap:7px"><button class="iconbtn" data-action="library" aria-label="Creature Library">📖</button><button class="iconbtn" data-action="help" aria-label="How to play">?</button><button class="iconbtn" data-action="resetAsk" aria-label="New match">↻</button></div></header>
 <section class="panel rival"><div class="leader ${mode==='attacking'?'targetable':''}" data-action="enemyLeader" role="button" tabindex="0" aria-label="Attack rival leader"><div class="avatar"><span class="avatarIcon">🦝</span><div><div class="label">Rival</div><div class="name">Mischief Mage</div></div></div><div class="health">♥ ${e.hp}/20</div></div><div class="statline"><span class="pill">🃏 ${e.hand.length} cards</span><span class="pill">📚 ${e.deck.length} in deck</span><span class="pill energy">💧 ${e.energy}/${e.maxEnergy}</span></div><div class="areaTitle">Rival's field <span class="helptext">${mode==='attacking'?'Tap an enemy to strike':''}</span></div><div class="board">${e.board.map((c,i)=>slotHTML(c,i,true)).join('')}</div></section>
 <div class="statline" style="justify-content:center"><span class="pill round">✧ Round ${game.round}</span><span class="pill">${game.winner?'Match ended':'Your turn'}</span></div>
 <section class="panel you"><div class="leader"><div class="avatar"><span class="avatarIcon">🧙</span><div><div class="label">Your side</div><div class="name">Creature Keeper</div></div></div><div class="health good">♥ ${p.hp}/20</div></div><div class="statline"><span class="pill energy">💧 ${p.energy}/${p.maxEnergy} energy</span><span class="pill">📚 ${p.deck.length} in deck</span><span class="pill">🃏 ${p.hand.length} in hand</span></div><div class="areaTitle">Your field <span class="helptext">${selection!==null?esc(p.board[selection]?.name||'')+' selected':'Select a critter'}</span></div><div class="board">${p.board.map((c,i)=>slotHTML(c,i,false)).join('')}</div></section>
 <div class="toast"><span>${esc(message||'Pick a critter to begin!')}</span>${mode!=='normal'?'<button style="border:0;background:#fff2;padding:5px 9px;border-radius:8px;color:#fff;font-weight:800" data-action="cancel">Cancel</button>':''}</div>
 <div class="actionbar"><button class="act attack ${mode==='attacking'?'active':''}" data-action="attack" ${game.winner?'disabled':''}>⚔️ Attack</button><button class="act fuse ${mode==='fusing'?'active':''}" data-action="fuse" ${game.winner?'disabled':''}>✨ Fuse</button><button class="act end" data-action="end" ${game.winner?'disabled':''}>End turn →</button></div>
 <div class="areaTitle">Your hand <span class="helptext">Tap to summon • Swipe for more</span></div><div class="hand">${p.hand.length?p.hand.map(handHTML).join(''):'<span class="small">Hand empty. End your turn to draw.</span>'}</div>
 <div class="log"><div class="logHead">Battle journal</div><div class="logMessage">${game.log.slice(0,3).map(esc).join('<br>')}</div></div><div class="attribution">Creature Test v0.2 · 21 example species · Fusions use old test mechanics</div>${overlay()}`;
}
document.addEventListener('click',(ev)=>{const t=ev.target.closest('[data-action]');if(!t)return;const a=t.dataset.action,i=Number(t.dataset.index);switch(a){case'card':playerCard(i);break;case'playerSlot':playerSlot(i);break;case'enemySlot':enemySlot(i);break;case'enemyLeader':enemyLeader();break;case'attack':chooseAttack();break;case'fuse':chooseFuse();break;case'end':endTurn();break;case'cancel':cancel();break;case'fusion':doFusion(t.dataset.type);break;case'library':selectedSpecies=0;modal='library';render();break;case'libraryPick':selectedSpecies=i;render();break;case'help':modal='help';render();break;case'closeModal':modal=null;render();break;case'resetAsk':modal='restart';render();break;case'restart':fresh();break;}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&modal){modal=null;mode='normal';render();}if((ev.key==='Enter'||ev.key===' ')&&ev.target?.dataset?.action==='enemyLeader'){ev.preventDefault();enemyLeader();}});
if(!restore())fresh();else render();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
</script></body></html>
