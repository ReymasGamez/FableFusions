<style>

*{box-sizing:border-box} html{-webkit-tap-highlight-color:transparent}body{margin:0;font-family:ui-rounded,-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",sans-serif;background:linear-gradient(165deg,#eeefff 0%,#fdf4e9 62%,#e7f6e8 100%);color:var(--ink);min-height:100dvh;overscroll-behavior-y:none}button{font:inherit;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.38;cursor:default}button:focus-visible{outline:3px solid #7355b5;outline-offset:2px}.screen{max-width:690px;margin:0 auto;padding:15px 15px calc(env(safe-area-inset-bottom,0px) + 23px)}.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.brand{display:flex;align-items:center;gap:10px}.mascot{width:44px;height:44px;border-radius:15px;background:#ddccff;display:grid;place-items:center;font-size:27px;box-shadow:inset 0 -3px #a992d0}.brand h1{font-size:21px;letter-spacing:-.9px;margin:0;line-height:1.05}.brand p{font-size:11px;letter-spacing:1.8px;font-weight:800;color:#9479aa;margin:3px 0 0}.iconbtn{border:2px solid #e3daea;border-radius:14px;background:#fffafbe6;color:#6d618d;font-size:18px;width:43px;height:43px}.panel{border:2px solid #e7e1eb;border-radius:22px;background:#fffffff0;box-shadow:var(--shadow);padding:13px;margin-bottom:13px}.rival{background:linear-gradient(135deg,#fff7fc,#fff0f0)}.you{background:linear-gradient(135deg,#f6fff9,#eff9fb)}.leader{display:flex;justify-content:space-between;align-items:center;gap:10px}.avatar{display:flex;align-items:center;gap:10px}.avatarIcon{height:43px;width:43px;background:#fff;border:2px solid #e6dfe9;border-radius:16px;display:grid;place-items:center;font-size:26px}.label{font-size:11px;color:#9387a3;text-transform:uppercase;letter-spacing:1px;font-weight:800}.name{font-size:17px;font-weight:900}.health{border:2px solid #f5c2ca;border-radius:14px;padding:6px 9px;color:#d45976;background:#fff;font-size:18px;font-weight:900;white-space:nowrap}.health.good{border-color:#bce6d6;color:#459c7f}.leader.targetable{outline:3px solid #ffbf8d;cursor:pointer;animation:pulse 1.15s infinite alternate}.statline{display:flex;gap:7px;align-items:center;margin:10px 0 3px;flex-wrap:wrap}.pill{border-radius:999px;font-size:12px;padding:5px 10px;background:#fff;color:#766c8d;font-weight:800;border:1px solid #e8e2ed}.round{background:#ece2fb;color:#7452a9}.energy{background:#e4f5ff;color:#317eac}.areaTitle{display:flex;justify-content:space-between;gap:7px;align-items:center;margin:14px 2px 8px;font-size:12px;font-weight:900;color:#7e7094;letter-spacing:1.2px;text-transform:uppercase}.helptext{font-size:11px;font-weight:650;letter-spacing:0;text-transform:none;color:#9c91a8}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.slot{position:relative;min-width:0;min-height:144px;border-radius:17px;border:2px dashed #d6d1dc;background:#ffffff7a;padding:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#aea8b6}.slot.occupied{border:2px solid #e7dceb;background:#fff;box-shadow:0 3px 9px #9585aa14;align-items:stretch;justify-content:flex-start;color:var(--ink)}.slot.selected{border-color:#9572db;background:#f3eafe;box-shadow:0 0 0 2px #d6c2f4}.slot.targetable{border-color:#ffb682;background:#fff7e9}.slot.exhausted{opacity:.74}.slot.occupied .art{font-size:37px;height:42px;display:grid;place-items:center;margin:6px 0 4px;white-space:nowrap;letter-spacing:-7px;padding-right:7px}.slot .elementDot{position:absolute;left:7px;top:6px;font-size:13px}.slot .fusedDot{position:absolute;right:7px;top:7px;color:#9961bd;font-size:11px;font-weight:900}.slot .creatureName{font-size:12px;line-height:1.2;min-height:29px;font-weight:900;overflow-wrap:anywhere;display:grid;place-items:center}.slot .tags{display:flex;justify-content:center;gap:4px;align-items:center;flex-wrap:wrap;margin:4px 0 6px}.slot .tag{font-size:9px;border-radius:7px;background:#f3edf9;padding:2px 4px;color:#8160a7;font-weight:800}.stats{display:flex;align-items:center;justify-content:space-between;gap:2px;margin-top:auto}.stat{font-weight:900;font-size:12px;white-space:nowrap}.stat.atk{color:#e37850}.stat.hp{color:#dc5d84}.placeholderIcon{font-size:28px;opacity:.7}.placeholderText{font-size:11px;font-weight:800;margin-top:4px}.hand{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding:3px 3px 9px;margin:0 -3px;scrollbar-width:none}.hand::-webkit-scrollbar{display:none}.handCard{position:relative;flex:0 0 125px;scroll-snap-align:start;border:2px solid #eee5ee;background:#fff;border-radius:16px;min-height:152px;padding:9px;text-align:left;display:flex;flex-direction:column;align-items:stretch;color:var(--ink);box-shadow:0 3px 8px #796aa010}.handCard.affordable{border-color:#c9ebdc}.handCard .handArt{display:block;font-size:34px;text-align:center;margin:5px 0 4px}.handCard .cardName{font-size:13px;min-height:32px;font-weight:900;text-align:center;line-height:1.15}.handCard .cardBottom{display:flex;justify-content:space-between;margin-top:auto;font-size:12px;font-weight:900}.cost{position:absolute;top:6px;right:6px;border-radius:9px;background:#d8f2ff;color:#447b9e;padding:3px 6px;font-size:12px;font-weight:900}.cardSub{text-align:center;color:#977eaa;font-size:11px;font-weight:800;margin-top:3px}.actionbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}.act{border:0;padding:13px 4px;border-radius:15px;font-weight:900;font-size:13px;box-shadow:inset 0 -3px #00000013;min-height:50px}.attack{background:#ffe5cf;color:#9c623f}.fuse{background:#ead5ff;color:#7450a7}.end{background:#d7f2e4;color:#358065}.act.active{outline:3px solid #9270cb;outline-offset:1px}.log{background:#fff9fff2;border:2px solid #eee6f0;border-radius:17px;padding:12px;margin:12px 0}.logHead{font-size:11px;letter-spacing:1px;color:#9e8aaa;text-transform:uppercase;font-weight:900;margin-bottom:4px}.logMessage{font-size:13px;color:#776c89;line-height:1.4}.toast{min-height:45px;border-radius:15px;background:#5b4a7c;color:#fff;padding:10px 13px;font-size:13px;font-weight:750;display:flex;align-items:center;justify-content:space-between;gap:6px}.toast b{color:#fff6cd}.overlay{position:fixed;inset:0;background:#37314c94;display:flex;align-items:flex-end;justify-content:center;padding:18px;z-index:20}.dialog{max-height:87dvh;overflow-y:auto;background:#fffcff;width:min(550px,100%);border-radius:26px;padding:20px;box-shadow:0 22px 65px #2114335c}.dialogTitle{font-size:23px;font-weight:950;letter-spacing:-.6px;margin-bottom:5px}.dialogDesc{color:#877c94;font-size:13px;line-height:1.4;margin-bottom:13px}.fusionList{display:grid;gap:8px}.fusionOption{display:flex;align-items:center;gap:11px;border:2px solid #e5ddeb;background:#fff;border-radius:15px;padding:12px;text-align:left}.fusionOption .emoji{font-size:24px}.fusionOption .flabel{font-size:14px;font-weight:900}.fusionOption .desc{font-size:11px;color:#94869e;line-height:1.3;margin-top:2px}.fusionOption .price{font-size:12px;font-weight:950;color:#638bad;margin-left:auto;white-space:nowrap}.secondary{border:2px solid #e9e1ec;border-radius:13px;padding:11px 13px;background:white;color:#8b75a1;font-weight:800}.modalFooter{display:flex;justify-content:flex-end;margin-top:12px}.win{font-size:44px;text-align:center;margin:10px}.center{text-align:center}.restart{width:100%;border:0;border-radius:14px;background:#d9caf4;padding:14px;font-weight:950;color:#5e3c8d;margin-top:10px}.small{font-size:12px;color:#887c95;line-height:1.5}.tutorial p{margin:9px 0}.attribution{text-align:center;font-size:10px;color:#ac9bad;margin-top:12px}@keyframes pulse{to{box-shadow:0 0 0 4px #ffd1a270}}@media(min-width:620px){.screen{padding-top:24px}.slot{min-height:166px}.slot.occupied .art{font-size:48px;height:56px}.handCard{flex-basis:142px;min-height:169px}}

<body><div id="app" class="screen"></div><script>
'use strict';
const STARTERS=[
 ['Emberbun','🐰','fire',1,2,3,'quick'],['Moss Pup','🐶','leaf',1,1,4,'mend'],
 ['Brook Otter','🦦','water',2,2,5,'ward'],['Starling','🐦','light',1,2,3,'quick'],
 ['Gloom Kit','🐈','shadow',2,3,3,'thorns'],['Cinder Cub','🐻','fire',2,3,5,'pierce'],
 ['Sprout Fawn','🦌','leaf',2,1,6,'ward'],['Moon Moth','🦋','light',1,1,3,'mend'],
 ['Tide Toad','🐸','water',1,1,4,'thorns'],['Dusk Fox','🦊','shadow',2,2,4,'pierce']
];
const SYM={fire:'🔥',water:'💧',leaf:'🍃',light:'✨',shadow:'🌙'};
const FUSIONS=[
 {id:'balanced',title:'Balanced',icon:'⚖️',cost:1,desc:'Evenly blend their strength; inherit both traits.'},
 {id:'biased',title:'Biased',icon:'🎯',cost:1,desc:'The first creature dominates this new form.'},
 {id:'additive',title:'Additive',icon:'➕',cost:2,desc:'Combine almost all HP and all attack.'},
 {id:'reactive',title:'Reactive',icon:'🌟',cost:2,desc:'The elements create something unexpected!'}
];
const REACTIONS={
 'fire-leaf':['Bramble Phoenix','🦚','blast'], 'fire-water':['Mist Salamander','🦎','draw'],
 'leaf-water':['Lotus Leviathan','🐉','restore'], 'light-shadow':['Eclipse Kirin','🦄','drain'],
 'light-water':['Aurora Koi','🐟','restore'], 'fire-shadow':['Umbral Dragon','🐲','blast']
};
let nextId=1;let game, selection=null, mode='normal', other=null, modal=null, message='';
const el=(id)=>document.getElementById(id);
const rand=(n)=>Math.floor(Math.random()*n);
const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function starter(row){return {id:nextId++,name:row[0],icon:row[1],element:row[2],cost:row[3],attack:row[4],hp:row[5],maxHP:row[5],traits:[row[6]],exhausted:true,depth:0};}
function shuffle(cards){for(let i=cards.length-1;i>0;i--){const j=rand(i+1);[cards[i],cards[j]]=[cards[j],cards[i]]}return cards;}
function newSide(){let s={hp:20,board:[null,null,null],hand:[],deck:shuffle(STARTERS.flatMap(r=>[starter(r),starter(r)])),energy:3,maxEnergy:3,fatigue:0};for(let i=0;i<4;i++)draw(s);return s;}
function draw(s){if(!s.deck.length){s.fatigue++;s.hp-=s.fatigue;return s.fatigue;}const c=s.deck.pop();if(s.hand.length<7)s.hand.push(c);return 0;}
function fresh(){nextId=1;game={player:newSide(),enemy:newSide(),round:1,winner:null,log:['Welcome! Summon two critters and fuse them.']};selection=null;mode='normal';other=null;modal=null;message='Tap a card below to summon it!';save();render();}
function save(){try{localStorage.setItem('fableFusionsWeb1',JSON.stringify({game,nextId}))}catch(_){}}
function restore(){try{let data=JSON.parse(localStorage.getItem('fableFusionsWeb1')||'null');if(data?.game?.player?.board?.length===3 && data?.game?.enemy?.board?.length===3){game=data.game;nextId=data.nextId||100;message='Welcome back! Your match was saved.';return true;}}catch(_){}return false;}
function log(s){game.log.unshift(s);game.log=game.log.slice(0,5);message=s;}
function checkWin(){if(game.player.hp<=0)game.winner='enemy';else if(game.enemy.hp<=0)game.winner='player';if(game.winner){modal='win';mode='normal';}}
function canAttack(c){return !!(c && c.hp>0 && !c.exhausted)}
function ready(s,energy){s.maxEnergy=Math.min(6,energy);s.energy=s.maxEnergy;for(let c of s.board)if(c)c.exhausted=false;}
function summon(index,enemy=false){let s=enemy?game.enemy:game.player;if(game.winner || !s.hand[index])return false;let slot=s.board.findIndex(c=>!c);const c=s.hand[index];if(slot<0){if(!enemy)log('All three slots are occupied. Fuse two critters to free a slot!');return false;}if(c.cost>s.energy){if(!enemy)log(`Need ${c.cost} energy to summon ${c.name}.`);return false;}
 s.hand.splice(index,1);s.energy-=c.cost;c.exhausted=!c.traits.includes('quick');s.board[slot]=c;log(`${enemy?'Rival':'You'} summoned ${c.name}!`);selection=null;mode='normal';return true;}
function recipe(a,b){return REACTIONS[[a,b].sort().join('-')]||['Wonderchimera','🦄','draw'];}
function createFusion(a,b,type){let traits=[...new Set([...a.traits,...b.traits])].slice(0,2),depth=Math.max(a.depth,b.depth)+1,attack=0,hp=0,name='',icon='',effect=null;
 if(type==='balanced'){name='Harmonykin';icon=a.icon+b.icon;hp=Math.ceil((a.hp+b.hp)/2)+2;attack=Math.ceil((a.attack+b.attack)/2)+1;}
 if(type==='biased'){name='Echokin '+a.name;icon=a.icon+'✨';hp=Math.floor((a.hp*7+b.hp*3+5)/10)+2;attack=Math.floor((a.attack*7+b.attack*3+5)/10)+1;}
 if(type==='additive'){name='Twinheart';icon=a.icon+b.icon;hp=a.hp+b.hp-1;attack=a.attack+b.attack;}
 if(type==='reactive'){[name,icon,effect]=recipe(a.element,b.element);hp=Math.ceil((a.hp+b.hp)/2)+3;attack=Math.ceil((a.attack+b.attack)/2)+2;}
 hp=clamp(hp,1,18);attack=clamp(attack,1,10);return {creature:{id:nextId++,name,icon,element:a.element,cost:0,attack,hp,maxHP:hp,traits,exhausted:true,depth},effect};}
function applyReaction(effect,enemy){if(!effect)return;let s=enemy?game.enemy:game.player,other=enemy?game.player:game.enemy;
 if(effect==='blast'){other.hp-=2;log('💥 The fusion blasts the opposing leader for 2!');}
 if(effect==='restore'){s.hp=Math.min(20,s.hp+3);log('💚 The fusion restores 3 leader HP!');}
 if(effect==='drain'){s.hp=Math.min(20,s.hp+2);other.hp-=2;log('🌘 The fusion drains 2 HP from the opposing leader!');}
 if(effect==='draw'){let fatigue=draw(s);log(fatigue?`Fatigue caused ${fatigue} damage!`:'🌟 The fusion draws a card!');}
 checkWin();}
function fuseSlots(i,j,type,enemy=false){let s=enemy?game.enemy:game.player;let a=s.board[i],b=s.board[j],cost=FUSIONS.find(f=>f.id===type)?.cost;
 if(i===j||!a||!b||s.energy<cost||game.winner)return false;
 s.energy-=cost;let {creature,effect}=createFusion(a,b,type);s.board[i]=creature;s.board[j]=null;
 log(`${enemy?'Rival':'You'} used ${type} fusion: ${creature.name}!`);applyReaction(effect,enemy);checkWin();return true;}
function strike(side,slot,target){let s=side==='player'?game.player:game.enemy,op=side==='player'?game.enemy:game.player,c=s.board[slot];if(!canAttack(c)||game.winner)return false;
 if(target===null && op.board.some(Boolean)){if(side==='player')log('Clear the rival’s critters before striking their leader!');return false;}
 c.exhausted=true;
 if(target!==null){let d=op.board[target];if(!d)return false;let damage=Math.max(0,c.attack+(c.traits.includes('pierce')?1:0)-(d.traits.includes('ward')?1:0));let counter=Math.max(0,d.attack-(c.traits.includes('ward')?1:0));d.hp-=damage;c.hp-=counter+(d.traits.includes('thorns')?1:0);if(d.hp<=0)op.board[target]=null;if(c.hp<=0)s.board[slot]=null;log(`${c.name} struck ${d.name} for ${damage} damage!`);}else{op.hp-=c.attack;log(`${c.name} hit ${side==='player'?'the rival':'your'} leader for ${c.attack}!`);}
 if(c.traits.includes('mend'))s.hp=Math.min(20,s.hp+1);checkWin();return true;}
function playerCard(index){if(game.winner)return;if(mode!=='normal'){log('Finish or cancel your current action first.');render();return;}summon(index);save();render();}
function playerSlot(i){let c=game.player.board[i];if(!c||game.winner)return;
 if(mode==='fusing'){if(i===selection){log('Choose a different creature to complete the fusion.');}else{other=i;modal='fusion';}render();return;}
 selection=i;mode='normal';log(`${c.name} selected. Tap Attack or Fuse.`);render();}
function enemySlot(i){if(mode!=='attacking'||selection===null){log('Select your own creature, then tap Attack.');render();return;}if(strike('player',selection,i)){selection=null;mode='normal';}save();render();}
function enemyLeader(){if(mode!=='attacking'||selection===null){log('Select a ready creature, then tap Attack.');render();return;}if(strike('player',selection,null)){selection=null;mode='normal';}save();render();}
function chooseAttack(){if(selection===null){log('Select one of your critters first.');}else if(!canAttack(game.player.board[selection])){log('That critter cannot attack until next round.');}else{mode='attacking';log('Now tap a rival critter, or their leader if the field is empty.');}render();}
function chooseFuse(){if(selection===null){log('Select the first critter to fuse.');}else if(game.player.board.filter(Boolean).length<2){log('You need two critters on the field to fuse.');}else{mode='fusing';log('Choose the SECOND critter. The first dominates Biased Fusion.');}render();}
function cancel(){mode='normal';selection=null;other=null;modal=null;message='Action cancelled.';render();}
function doFusion(type){if(selection===null||other===null)return;if(!fuseSlots(selection,other,type)){log('Not enough energy for that fusion.');render();return;}selection=null;other=null;modal=null;mode='normal';save();render();}
function enemyTurn(){let s=game.enemy;ready(s,game.round+2);let fatigue=draw(s);if(fatigue){log(`Rival took ${fatigue} fatigue damage.`);checkWin();}if(game.winner)return;
 for(let n=0;n<3;n++){if(!s.board.some(c=>!c))break;let options=s.hand.map((c,i)=>({...c,index:i})).filter(c=>c.cost<=s.energy);if(!options.length)break;options.sort((a,b)=>b.attack-a.attack);summon(options[0].index,true);}
 let slots=s.board.map((c,i)=>c?i:-1).filter(i=>i>=0);if(slots.length>=2&&s.energy>=1&&rand(3)===0){const type=s.energy>=2?'reactive':'balanced';fuseSlots(slots[0],slots[1],type,true);}
 for(let i=0;i<3&&!game.winner;i++){if(!canAttack(s.board[i]))continue;let targets=game.player.board.map((c,j)=>c?j:-1).filter(j=>j>=0);let target=targets.length?targets.sort((a,b)=>game.player.board[a].hp-game.player.board[b].hp)[0]:null;strike('enemy',i,target);}}
function endTurn(){if(game.winner)return;selection=null;other=null;mode='normal';enemyTurn();if(!game.winner){game.round++;ready(game.player,game.round+2);let fatigue=draw(game.player);if(fatigue){log(`You took ${fatigue} fatigue damage.`);checkWin();}if(!game.winner)log(`Round ${game.round}! Your critters are ready.`);}save();render();}
const creatureHTML=(c)=>!c?'<div class="placeholderIcon">✦</div><span class="placeholderText">Empty slot</span>':`<span class="elementDot">${SYM[c.element]}</span>${c.depth?`<span class="fusedDot">FUSION ${c.depth}</span>`:''}<div class="art">${esc(c.icon)}</div><div class="creatureName">${esc(c.name)}</div><div class="tags">${c.traits.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="stats"><span class="stat atk">⚔ ${c.attack}</span><span class="stat hp">♥ ${c.hp}/${c.maxHP}</span></div>`;
function slotHTML(c,i,enemy){const selected=!enemy&&selection===i, targetable=enemy&&mode==='attacking', exhausted=c?.exhausted;return `<button class="slot ${c?'occupied':''} ${selected?'selected':''} ${targetable&&c?'targetable':''} ${exhausted?'exhausted':''}" data-action="${enemy?'enemySlot':'playerSlot'}" data-index="${i}" aria-label="${c?esc(c.name):'Empty slot'}">${creatureHTML(c)}</button>`;}
function handHTML(c,i){return `<button class="handCard ${c.cost<=game.player.energy?'affordable':''}" data-action="card" data-index="${i}"><span class="cost">💧${c.cost}</span><span class="handArt">${esc(c.icon)}</span><span class="cardName">${esc(c.name)}</span><span class="cardSub">${SYM[c.element]} ${esc(c.traits[0])}</span><div class="cardBottom"><span style="color:#db8055">⚔ ${c.attack}</span><span style="color:#da6f8c">♥ ${c.hp}</span></div></button>`;}
function overlay(){if(!modal)return '';if(modal==='win')return `<div class="overlay"><div class="dialog center"><div class="win">${game.winner==='player'?'🏆':'🌧️'}</div><div class="dialogTitle">${game.winner==='player'?'You won!':'The rival wins!'}</div><div class="dialogDesc">${game.winner==='player'?'Your little fusions saved the day.':'Try new fusion pairings and fight again!'}</div><button class="restart" data-action="restart">Play another match ✨</button></div></div>`;
 if(modal==='help')return `<div class="overlay"><div class="dialog tutorial"><div class="dialogTitle">How to play ✨</div><div class="dialogDesc">Make magical critter combinations in this little offline TCG.</div><p>🐰 <b>Summon:</b> Tap a card in your hand. Each costs energy. You have three field slots.</p><p>⚔️ <b>Attack:</b> Tap your critter → Attack → an enemy critter. Defeat all enemies to attack their leader. Creatures usually wait a turn to attack.</p><p>🧬 <b>Fuse:</b> Tap your first critter → Fuse → a second critter → one of four styles. The first critter dominates Biased Fusion.</p><p>🌟 <b>Reactive:</b> Element combinations can become special animals with surprising effects!</p><p>💖 <b>Victory:</b> Bring the rival's leader from 20 HP down to zero.</p><p class="small">Your match is saved in this browser. When hosted on HTTPS, the game can be added to the iPhone Home Screen and used offline after it has loaded once.</p><div class="modalFooter"><button class="secondary" data-action="closeModal">Got it!</button></div></div></div>`;
 if(modal==='restart')return `<div class="overlay"><div class="dialog"><div class="dialogTitle">Start over?</div><div class="dialogDesc">Your current match will be replaced.</div><div class="modalFooter" style="justify-content:space-between"><button class="secondary" data-action="closeModal">Keep playing</button><button class="restart" style="width:auto;margin:0" data-action="restart">New match</button></div></div></div>`;
 const a=game.player.board[selection],b=game.player.board[other];return `<div class="overlay"><div class="dialog"><div class="dialogTitle">Choose your fusion 🧬</div><div class="dialogDesc">${a?esc(a.icon):''} ${a?esc(a.name):''} + ${b?esc(b.icon):''} ${b?esc(b.name):''}<br>Choose how these two critters become one.</div><div class="fusionList">${FUSIONS.map(f=>`<button class="fusionOption" data-action="fusion" data-type="${f.id}" ${f.cost>game.player.energy?'disabled':''}><span class="emoji">${f.icon}</span><span><div class="flabel">${f.title}</div><div class="desc">${f.desc}</div></span><span class="price">💧${f.cost}</span></button>`).join('')}</div><div class="modalFooter"><button class="secondary" data-action="cancel">Cancel</button></div></div></div>`;}
function render(){if(!game)return;const p=game.player,e=game.enemy;
 el('app').innerHTML=`<header class="topline"><div class="brand"><span class="mascot">🐰</span><div><h1>Fable Fusions</h1><p>CRITTER CARD DUEL</p></div></div><div style="display:flex;gap:7px"><button class="iconbtn" data-action="help" aria-label="How to play">?</button><button class="iconbtn" data-action="resetAsk" aria-label="New match">↻</button></div></header>
 <section class="panel rival"><div class="leader ${mode==='attacking'?'targetable':''}" data-action="enemyLeader" role="button" tabindex="0" aria-label="Attack rival leader"><div class="avatar"><span class="avatarIcon">🦝</span><div><div class="label">Rival</div><div class="name">Mischief Mage</div></div></div><div class="health">♥ ${e.hp}/20</div></div><div class="statline"><span class="pill">🃏 ${e.hand.length} cards</span><span class="pill">📚 ${e.deck.length} in deck</span><span class="pill energy">💧 ${e.energy}/${e.maxEnergy}</span></div><div class="areaTitle">Rival's field <span class="helptext">${mode==='attacking'?'Tap an enemy to strike':''}</span></div><div class="board">${e.board.map((c,i)=>slotHTML(c,i,true)).join('')}</div></section>
 <div class="statline" style="justify-content:center"><span class="pill round">✧ Round ${game.round}</span><span class="pill">${game.winner?'Match ended':'Your turn'}</span></div>
 <section class="panel you"><div class="leader"><div class="avatar"><span class="avatarIcon">🧙</span><div><div class="label">Your side</div><div class="name">Creature Keeper</div></div></div><div class="health good">♥ ${p.hp}/20</div></div><div class="statline"><span class="pill energy">💧 ${p.energy}/${p.maxEnergy} energy</span><span class="pill">📚 ${p.deck.length} in deck</span><span class="pill">🃏 ${p.hand.length} in hand</span></div><div class="areaTitle">Your field <span class="helptext">${selection!==null?esc(p.board[selection]?.name||'')+' selected':'Select a critter'}</span></div><div class="board">${p.board.map((c,i)=>slotHTML(c,i,false)).join('')}</div></section>
 <div class="toast"><span>${esc(message||'Pick a critter to begin!')}</span>${mode!=='normal'?'<button style="border:0;background:#fff2;padding:5px 9px;border-radius:8px;color:#fff;font-weight:800" data-action="cancel">Cancel</button>':''}</div>
 <div class="actionbar"><button class="act attack ${mode==='attacking'?'active':''}" data-action="attack" ${game.winner?'disabled':''}>⚔️ Attack</button><button class="act fuse ${mode==='fusing'?'active':''}" data-action="fuse" ${game.winner?'disabled':''}>✨ Fuse</button><button class="act end" data-action="end" ${game.winner?'disabled':''}>End turn →</button></div>
 <div class="areaTitle">Your hand <span class="helptext">Tap to summon • Swipe for more</span></div><div class="hand">${p.hand.length?p.hand.map(handHTML).join(''):'<span class="small">Hand empty. End your turn to draw.</span>'}</div>
 <div class="log"><div class="logHead">Battle journal</div><div class="logMessage">${game.log.slice(0,3).map(esc).join('<br>')}</div></div><div class="attribution">Tiny prototype · Four kinds of fusion · Made for iPhone</div>${overlay()}`;
}
document.addEventListener('click',(ev)=>{const t=ev.target.closest('[data-action]');if(!t)return;const a=t.dataset.action,i=Number(t.dataset.index);switch(a){case'card':playerCard(i);break;case'playerSlot':playerSlot(i);break;case'enemySlot':enemySlot(i);break;case'enemyLeader':enemyLeader();break;case'attack':chooseAttack();break;case'fuse':chooseFuse();break;case'end':endTurn();break;case'cancel':cancel();break;case'fusion':doFusion(t.dataset.type);break;case'help':modal='help';render();break;case'closeModal':modal=null;render();break;case'resetAsk':modal='restart';render();break;case'restart':fresh();break;}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&modal){modal=null;mode='normal';render();}if((ev.key==='Enter'||ev.key===' ')&&ev.target?.dataset?.action==='enemyLeader'){ev.preventDefault();enemyLeader();}});
if(!restore())fresh();else render();
</script></body></html>
